[build]
	command = "npm run build"
	publish = "dist"
	functions = "netlify/functions"

[build.environment]
	NODE_VERSION = "22.12.0"

[[redirects]]
	from = "/api"
	to = "/.netlify/functions/api/api"
	status = 200

[[redirects]]
	from = "/api/*"
	to = "/.netlify/functions/api/api/:splat"
	status = 200

[[redirects]]
	from = "/*"
	to = "/index.html"
	status = 200
